<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Erro</title>

    <style>

        body{

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

            background:#f4f4f4;

            font-family:Arial;
        }

        .box{

            background:white;

            padding:50px;

            border-radius:15px;

            text-align:center;

            box-shadow:
            0 5px 20px rgba(0,0,0,.1);

        }

        a{

            display:inline-block;

            margin-top:20px;

            background:black;
            color:white;

            text-decoration:none;

            padding:12px 25px;

            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Oops 😅</h1>

    <p>
        Algo deu errado ou veículo não encontrado.
    </p>

    <a href="/">
        Voltar ao início
    </a>

</div>

</body>

</html>
